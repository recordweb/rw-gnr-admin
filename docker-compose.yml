# =============================================================================
# docker-compose.yml - rw-gnr-admin (standalone Compose project)
# -----------------------------------------------------------------------------
# Deliberately its own Compose project (own repo, own project name, own
# primary network) - NOT folded into rw-rrn's or the PoC infra repo's
# docker-compose.yml. This demonstrates that rw-gnr-admin is an independent
# deployable, consistent with "every organisation runs its own instance,
# scoped to its own Fabric identity".
#
# It joins two EXTERNAL networks owned by other stacks, purely as bridges,
# without requiring changes to those stacks' own compose files:
#   - fabric_net  (from rw-rrn)      - so it can reach the Fabric gateway
#                                        peer by its Docker DNS hostname.
#   - tws-proxy   (from the infra    - so the shared nginx reverse proxy
#     repo running nginx)              (container `poc-nginx`) can reach
#                                        this container by its Docker DNS
#                                        hostname, without rw-gnr-admin ever
#                                        joining that repo's internal
#                                        `poc_network`.
#
# Both /opt/rw-rrn and /opt/rw-gnr-admin (and the infra repo running nginx)
# are expected to live under /opt/ on the same VPS, deployed via the same
# SSH user.
#
# Prerequisites (both must already exist/be running before this project is
# started, since `external: true` only attaches to existing networks rather
# than creating them):
#   - rw-rrn's docker-compose.yml must define a network named `fabric_net`.
#   - The infra repo's docker-compose.yml must define the external network
#     `tws-proxy` and nginx must already be attached to it.
# =============================================================================

name: rw-gnr-admin

services:
  rw-gnr-admin:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rw-gnr-admin
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_DIR: /app/frontend
    volumes:
      # Read-only mount of this organisation's own crypto material, matching
      # the paths referenced by PEER_TLS_CA_PATH / CERT_PATH / KEY_PATH in
      # backend/.env. Adjust the host-side source path to wherever this
      # organisation's crypto-config actually lives on the VPS.
      - ${CRYPTO_CONFIG_HOST_PATH:-/opt/rw-rrn/crypto-config}:/app/crypto:ro
    # No host port published: reached exclusively via nginx (tws-proxy),
    # not directly. Remove the comment below and uncomment if you also want
    # direct host access for debugging.
    # ports:
    #   - "3000:3000"
    networks:
      # Primary network: own, isolated, brought up by this project itself -
      # demonstrates that rw-gnr-admin does not depend on any other repo's
      # compose file to exist, except via the two explicit bridges below.
      - rw-gnr-admin-net
      # Bridge 1: joins rw-rrn's existing Fabric Docker network purely so
      # the gateway peer's hostname resolves via Docker DNS.
      - fabric_net
      # Bridge 2: joins the infra repo's existing nginx-facing network
      # purely so nginx (container `poc-nginx`) can reach this container by
      # its Docker DNS hostname (`rw-gnr-admin`) for proxy_pass.
      - tws-proxy

networks:
  rw-gnr-admin-net:
    driver: bridge
  fabric_net:
    external: true
  tws-proxy:
    external: true
    name: tws-proxy